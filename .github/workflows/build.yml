name: Build Windows

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install PyQt6 numpy soundfile pydub pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --onedir --windowed --name "NikonChingeAnalyzer" analyzer.py --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup --yes --quiet

      - name: Write Inno Setup script
        run: |
          $iss = @"
          [Setup]
          AppName=NikonChingeAnalyzer
          AppVersion=1.0.0
          DefaultDirName={autopf}\NikonChingeAnalyzer
          DefaultGroupName=NikonChingeAnalyzer
          OutputBaseFilename=NikonChingeAnalyzer_Setup
          OutputDir=installer_out
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "dist\NikonChingeAnalyzer\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\NikonChingeAnalyzer"; Filename: "{app}\NikonChingeAnalyzer.exe"
          Name: "{autodesktop}\NikonChingeAnalyzer"; Filename: "{app}\NikonChingeAnalyzer.exe"

          [Run]
          Filename: "{app}\NikonChingeAnalyzer.exe"; Description: "Launch now"; Flags: nowait postinstall skipifsilent
          "@
          New-Item -Path installer_out -ItemType Directory -Force
          $iss | Out-File -FilePath setup.iss -Encoding utf8
        shell: pwsh

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss'
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NikonChingeAnalyzer-Windows-Setup
          path: installer_out/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: NikonChingeAnalyzer-Windows-Setup
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          name: "니콘 친게 음원 감별사 ${{ github.ref_name }}"
          body: |
            ## 니콘 친게 음원 감별사 ${{ github.ref_name }}
            **Windows**: `NikonChingeAnalyzer_Setup.exe` 다운로드 후 설치
            FLAC · WAV · MP3 · AIFF · OGG · M4A 지원
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
